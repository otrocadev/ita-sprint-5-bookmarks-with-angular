<section>
  <h2>Download the extension</h2>
  <span>
    We've got more browsers in the pipeline. Please do let us know if you've got
    a favorite you'd like us to prioritize.
  </span>
  <div id="extension-browsers">
    @for( browser of browserData; track browser.navigator){
    <app-browser-extension-card
      navigator="{{ browser.navigator }}"
      version="{{ browser.version }}"
      url="{{ browser.url }}"
    ></app-browser-extension-card>
    }
  </div>
</section>
